<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Instagraph app icon: a chat bubble holding a bar chart.
       Same indigo and bar motif as frontend/public/favicon.svg. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#shine)"/>

  <path filter="url(#shadow)" fill="#fff"
        d="M320 220H704A120 120 0 0 1 824 340V580A120 120 0 0 1 704 700H450L300 806Q280 818 286 796L330 700H320A120 120 0 0 1 200 580V340A120 120 0 0 1 320 220Z"/>

  <g fill="url(#bar)">
    <rect x="300" y="424" width="64" height="176" rx="32"/>
    <rect x="420" y="314" width="64" height="286" rx="32"/>
    <rect x="540" y="490" width="64" height="110" rx="32"/>
    <rect x="660" y="380" width="64" height="220" rx="32"/>
  </g>
</svg>
