[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "instagraph"
version = "0.1.0"
description = "Local statistics and charts for Instagram direct-message exports"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "orjson>=3.10",
    "polars>=1.10",
    "pyarrow>=16",
    "regex>=2024.5",
    "emoji>=2.12",
    "pillow>=10.3",
    "mutagen>=1.47",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
# Optional AI assistant (docs/ai-assistant.md): the Anthropic API provider.
ai = ["anthropic>=2.7"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-regex",
    "anthropic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/instagraph"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID", "SIM", "RUF"]
# Multilingual text (Slovak/Czech, typographic apostrophes, mojibake samples) is normal here.
allowed-confusables = ["’", "–", "´", "×"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["instagraph"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["instagraph"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["mutagen.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
filterwarnings = [
    "error::DeprecationWarning:instagraph.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]
